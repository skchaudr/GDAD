id: graph-reader
title: Graph reader, journal, frontier
why: >
  Everything else reads the graph. Until a node set can be loaded, validated,
  and its frontier computed, nothing else has a substrate to stand on.
depends_on: []
acceptance_criteria:
  - id: ac-1
    criterion: "`gdad check` loads .gdad/project.yaml and nodes/*.yaml and exits non-zero naming the offending node for: duplicate id, unresolved depends_on, dependency cycle, missing acceptance_criteria."
  - id: ac-2
    criterion: "Machine progress is an append-only JSONL journal outside the repo (~/.gdad/state/<project>/journal.jsonl); every line carries ts, actor, node, event, and reason. Nothing rewrites prior lines. A torn final line is reported and skipped; every earlier line still loads."
  - id: ac-3
    criterion: "`gdad status` derives each node's state on read from the journal, receipt files, committed acceptance records, and depends_on: blocked, ready, dispatched, dispatched-without-evidence, unevaluated, failed, needs-graph-change, provisional, accepted. Nothing derivable is stored."
  - id: ac-4
    criterion: "A dependency is satisfied only by evidence: an acceptance record committed in .gdad/acceptance/, or a provisional event whose referenced receipt file exists, is a pass for that node, and is the node's latest receipt. A provisional event without a resolvable passing receipt satisfies nothing and is shown as a warning."
  - id: ac-5
    criterion: "Runs on a fresh machine with only uv (or python3 + PyYAML) installed."
constraints:
  - No status field in any node or project YAML.
  - Single entry point; no database, no daemon.
required_artifacts:
  - gdad CLI entry point
  - tests covering each ac-1 rejection case, the torn-line case, and dependency satisfaction with and without a resolvable receipt
milestones:
  - id: ms-1
    description: Loader + validator with failing-case tests
  - id: ms-2
    description: Journal append + state derivation; `gdad status` prints this graph
