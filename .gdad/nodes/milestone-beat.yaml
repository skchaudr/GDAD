id: milestone-beat
title: Milestone-beat evaluation schedule
why: >
  A final-only verdict is detection after the fact. Scoped evaluations at
  authored milestones surface drift while it is cheap to act on.
depends_on: [evaluator, dispatch]
acceptance_criteria:
  - id: ac-1
    criterion: "A beat is observable without executor cooperation: a new commit on the attempt branch is a beat; a commit trailer `GDAD-Milestone: <ms-id>` names the milestone when the executor supplies one."
  - id: ac-2
    criterion: "Each beat appends a scoped evaluation record (first milestone = alignment, last milestone = integrity) to the attempt's record stream; the final verdict still runs at completion and is the only record that can mark provisional."
  - id: ac-3
    criterion: "Nodes without milestones get at most one mid-run beat, triggered by commit count or elapsed time from config."
  - id: ac-4
    criterion: "An attempt whose executor died without a completion signal still receives a final verdict on the next tick."
  - id: ac-5
    criterion: "Beat records are observations; none pauses, redirects, or retries the executor."
constraints:
  - The scheduler is a poll over git and the journal; it needs no hooks into executor internals.
required_artifacts:
  - a record stream with at least two beats and a final verdict on a real attempt
